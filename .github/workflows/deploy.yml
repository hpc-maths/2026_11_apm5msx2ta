# Construit le Jupyter Book et le publie sur GitHub Pages.
# Prérequis : dans Settings > Pages du dépôt, choisir Source = "GitHub Actions".

name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Le site est servi depuis https://<compte>.github.io/<nom du dépôt> :
  # BASE_URL doit valoir /<nom du dépôt>. Sur un dépôt nommé <compte>.github.io,
  # le site est à la racine du domaine et BASE_URL doit être vide.
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

# Deux jobs séparés (modèle officiel GitHub) : le déploiement ne démarre qu'une fois
# l'archive du site entièrement enregistrée. Dans un seul job, le déploiement la
# cherchait parfois trop tôt ("No artifacts named github-pages were found").
# En cas d'échec du déploiement seul, "Re-run failed jobs" ne relance que celui-ci.
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Shell de connexion : l'environnement conda est activé à chaque étape.
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install the conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: apm5msx2ta
          use-mamba: true

      - name: Build the book
        # --execute : les notebooks sont exécutés lors de la construction.
        run: jupyter book build --html --execute

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
